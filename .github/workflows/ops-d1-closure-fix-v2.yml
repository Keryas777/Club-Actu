name: Ops repair closure fix patcher

on:
  push:
    branches:
      - codex/d1-guard-optimize-closure-status
    paths:
      - .github/workflows/ops-d1-closure-fix-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-guard-optimize-closure-status
      - name: Repair route patch logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ops-d1-closure-fix.yml')
          text = p.read_text()
          start = text.index("          old = '''    if (url.pathname")
          end = text.index("\n\n          residual_path", start)
          replacement = r'''          old = ''' + "'''" + r'''    if (url.pathname === "/api/phase-a-closure-status" && request.method === "GET") {
      if (!env.DB) return json({ ok: false, error: "D1 binding DB missing" }, { status: 503 });
      const result = await getPhaseAClosureStatusFixed(env.DB);
      return json({ ok: true, ...result });
    }''' + "'''" + r'''
          new = ''' + "'''" + r'''    if (url.pathname === "/api/phase-a-closure-status" && request.method === "GET") {
      if (!env.DB) return json({ ok: false, error: "D1 binding DB missing" }, { status: 503 });
      if (!env.MANUAL_TRIGGER_TOKEN) {
        return json({ ok: false, error: "Manual trigger not configured" }, { status: 503 });
      }
      const token = bearerToken(request);
      if (!token || token !== env.MANUAL_TRIGGER_TOKEN) {
        return json({ ok: false, error: "Unauthorized" }, { status: 401 });
      }
      const result = await getPhaseAClosureStatusFixed(env.DB);
      return json({ ok: true, ...result });
    }''' + "'''" + r'''
          if old not in text:
              raise SystemExit('closure-status route block not found')
          index_path.write_text(text.replace(old, new, 1))'''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
      - name: Commit repaired patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ops-d1-closure-fix-v2.yml
          git add .github/workflows/ops-d1-closure-fix.yml
          git commit -m "ops: repair closure fix patcher"
          git push origin HEAD:codex/d1-guard-optimize-closure-status
