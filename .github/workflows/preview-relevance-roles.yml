name: Preview relevance roles

on:
  workflow_dispatch:
    inputs:
      club:
        description: "Club id"
        required: true
        default: "psg"
        type: choice
        options:
          - psg
          - om
          - ol
      article_limit:
        description: "Maximum ambiguous articles to classify"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Run protected role-classifier preview
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          CLUB: ${{ github.event.inputs.club }}
          ARTICLE_LIMIT: ${{ github.event.inputs.article_limit }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MANUAL_TRIGGER_TOKEN}" ]]; then
            echo "MANUAL_TRIGGER_TOKEN repository secret is missing."
            exit 1
          fi

          if [[ ! "${ARTICLE_LIMIT}" =~ ^[0-9]+$ ]]; then
            echo "article_limit must be an integer"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${MANUAL_TRIGGER_TOKEN}" \
            --header "Accept: application/json" \
            "https://club-actu.deliriousfan7.workers.dev/api/relevance-role-preview?club=${CLUB}&limit=${ARTICLE_LIMIT}" \
            | python3 -m json.tool
