name: Ops D1.2 v2 STORY AI smoke

on:
  push:
    branches:
      - codex/d1-story-ai-smoke
    paths:
      - .github/workflows/ops-d1-story-ai-v2-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect pending ambiguity queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT a.id attempt_id, a.event_id, ROUND(a.best_hybrid_score,6) hybrid, a.family_compatible, a.ai_status, e.family, e.primary_people_json people, e.primary_clubs_json clubs, r.source_id, r.title FROM story_match_attempts a JOIN event_candidates e ON e.id=a.event_id JOIN raw_articles r ON r.id=e.article_id WHERE a.decision='AMBIGUOUS_AI' AND e.lifecycle_status='active' AND e.match_status='ambiguous_ai' AND a.ai_status IN ('pending','retry') ORDER BY a.created_at ASC,a.id ASC LIMIT 10;"
      - name: Call live v2 shadow resolver
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          BASE_URL: https://club-actu.deliriousfan7.workers.dev
        run: |
          set -euo pipefail
          started="$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "$started" > started_at.txt
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $MANUAL_TRIGGER_TOKEN" \
            --header 'Accept: application/json' \
            "$BASE_URL/api/process-story-ai-batch?limit=4")"
          echo "HTTP $status"
          cat response.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 20; fi
      - name: Audit v2 persistence and membership barrier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          started="$(cat started_at.txt)"
          echo '=== AI ATTEMPTS TOUCHED BY THIS RUN ==='
          npx wrangler d1 execute DB --remote --command "SELECT a.id attempt_id, a.event_id, ROUND(a.best_hybrid_score,6) hybrid, a.family_compatible, a.ai_status, a.ai_attempts, a.ai_provider, a.ai_model, a.ai_prompt_version, a.ai_error_code, a.ai_error_detail, a.ai_response_json, e.family, e.primary_people_json people, e.primary_clubs_json clubs, r.source_id, r.title, substr(e.evidence_json,1,1400) evidence FROM story_match_attempts a JOIN event_candidates e ON e.id=a.event_id JOIN raw_articles r ON r.id=e.article_id WHERE a.updated_at >= '$started' AND (a.ai_prompt_version IS NOT NULL OR a.ai_status IN ('stale','review_pending','retry','failed')) ORDER BY a.updated_at,a.id;"
          echo '=== ACTIVE MEMBERSHIP FOR TOUCHED AMBIGUOUS EVENTS (MUST BE NONE) ==='
          npx wrangler d1 execute DB --remote --command "SELECT a.id attempt_id, a.event_id, a.ai_status, se.story_id, se.assignment_kind FROM story_match_attempts a LEFT JOIN story_events se ON se.event_id=a.event_id AND se.membership_status='active' WHERE a.updated_at >= '$started' AND a.decision='AMBIGUOUS_AI' ORDER BY a.id;"
