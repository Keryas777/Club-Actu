name: Ops inspect STORY vector storage

on:
  push:
    branches:
      - "codex/d1-story-v1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Inspect remote D1 embedding storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "
            SELECT
              e.id AS event_id,
              e.article_id,
              e.family,
              e.stage,
              e.published_at,
              substr(e.primary_people_json,1,220) AS people,
              substr(e.primary_clubs_json,1,220) AS clubs,
              e.relation_from,
              e.relation_to,
              e.competition,
              substr(e.opponents_json,1,180) AS opponents,
              substr(e.lexical_tokens_json,1,420) AS lexical,
              r.title AS article_title
            FROM event_candidates e
            JOIN raw_articles r ON r.id=e.article_id
            JOIN event_embeddings emb ON emb.event_id=e.id
             AND emb.status='ready'
             AND typeof(emb.vector)='blob'
            WHERE e.lifecycle_status='active'
              AND e.match_status='ready_match'
            ORDER BY e.created_at ASC, e.id ASC
            LIMIT 20;
          "
          npx wrangler d1 execute DB --remote --json --command "
            SELECT
              s.id AS story_id,
              s.family AS story_family,
              s.member_count,
              s.centroid_revision,
              s.founder_event_id,
              e.article_id,
              e.family AS founder_family,
              r.title AS founder_title
            FROM stories s
            JOIN event_candidates e ON e.id=s.founder_event_id
            JOIN raw_articles r ON r.id=e.article_id
            WHERE s.status='active'
            ORDER BY s.created_at ASC;
          "
