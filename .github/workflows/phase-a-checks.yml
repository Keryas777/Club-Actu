name: Phase A checks

on:
  push:
    branches:
      - "agent/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check src/collector.js
          node --check src/processor.js
          node --check src/index.js
          node --check src/sources.js
          node --check src/grouper.js
          node --check src/relevance-role.js
          node --check src/index-phase-a-fix.js
          node --check src/phase-b-event-persistence.js
          node --check src/phase-b-event-queue.js
          node --check src/story-event-representation.js
          node --check src/event-embedding-queue.js
          node --check src/story-matching-core.js
          node --check src/story-match-store.js
          node --check src/story-matcher.js

      - name: Run unit tests
        run: npm test

      - name: Validate migrations from empty database
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          for path in sorted(Path("migrations").glob("*.sql")):
              db.executescript(path.read_text(encoding="utf-8"))

          expected = {
              "clubs",
              "sources",
              "club_sources",
              "raw_articles",
              "article_versions",
              "collection_runs",
              "club_aliases",
              "article_extractions",
              "article_club_assessments",
              "processing_runs",
              "article_club_role_classifications",
              "event_candidates",
              "event_embeddings",
              "stories",
              "story_events",
              "story_clubs",
              "story_index_keys",
              "story_match_attempts",
              "story_shortlist_contexts",
              "story_shortlist_token_df",
              "story_event_index_keys",
          }
          actual = {
              row[0]
              for row in db.execute(
                  "SELECT name FROM sqlite_master WHERE type='table'"
              )
          }
          missing = expected - actual
          if missing:
              raise SystemExit(f"Missing tables: {sorted(missing)}")

          print("Migrations OK:", ", ".join(sorted(expected)))
          PY
