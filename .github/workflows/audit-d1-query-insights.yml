name: Audit D1 query insights

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum query fingerprints per database"
        required: false
        default: "30"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-d1-query-insights.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: d1-query-insights-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Rank account D1 queries by row reads
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: List account D1 databases and fetch query insights
        id: insights
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REQUESTED_LIMIT: ${{ inputs.limit || '30' }}
        run: |
          set -uo pipefail
          mkdir -p d1-insights/db

          LIMIT="$REQUESTED_LIMIT"
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then LIMIT=30; fi
          if [ "$LIMIT" -lt 5 ]; then LIMIT=5; fi
          if [ "$LIMIT" -gt 100 ]; then LIMIT=100; fi

          status=0
          if ! npx wrangler d1 list --json > d1-insights/databases.json 2> d1-insights/databases.stderr; then
            status=1
          fi

          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('d1-insights/databases.json')
          try:
              raw=json.loads(p.read_text()) if p.exists() and p.read_text().strip() else []
          except Exception:
              raw=[]
          rows=raw.get('result', raw) if isinstance(raw,dict) else raw
          if not isinstance(rows,list): rows=[]
          out=[]
          for row in rows:
              if not isinstance(row,dict): continue
              name=row.get('name') or row.get('database_name')
              uid=row.get('uuid') or row.get('id')
              if name: out.append((str(name), str(uid or '')))
          pathlib.Path('d1-insights/database-list.tsv').write_text(''.join(f'{n}\t{u}\n' for n,u in out))
          PY

          while IFS=$'\t' read -r DBNAME DBID; do
            [ -n "$DBNAME" ] || continue
            SAFE="$(printf '%s' "$DBNAME" | sed 's/[^A-Za-z0-9_.-]/_/g')"
            printf '%s\t%s\t%s\n' "$SAFE" "$DBNAME" "$DBID" >> d1-insights/database-map.tsv

            for PERIOD in 1d 7d; do
              if ! npx wrangler d1 insights "$DBNAME" \
                --time-period "$PERIOD" \
                --sort-type=sum --sort-by=reads --sort-direction=DESC \
                --limit "$LIMIT" --json \
                > "d1-insights/db/${SAFE}-${PERIOD}-total.json" \
                2> "d1-insights/db/${SAFE}-${PERIOD}-total.stderr"; then
                status=1
              fi
            done

            if ! npx wrangler d1 insights "$DBNAME" \
              --time-period 1d \
              --sort-type=avg --sort-by=reads --sort-direction=DESC \
              --limit "$LIMIT" --json \
              > "d1-insights/db/${SAFE}-1d-avg.json" \
              2> "d1-insights/db/${SAFE}-1d-avg.stderr"; then
              status=1
            fi
          done < d1-insights/database-list.tsv

          exit "$status"

      - name: Build account-wide audit summary
        if: always()
        env:
          INSIGHTS_OUTCOME: ${{ steps.insights.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p d1-insights/db
          python3 - <<'PY' | tee d1-insights/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, re
          root=pathlib.Path('d1-insights')

          def load(path):
              try:
                  raw=json.loads(path.read_text()) if path.exists() and path.read_text().strip() else []
              except Exception:
                  return []
              if isinstance(raw,dict):
                  for k in ('result','results','data'):
                      if isinstance(raw.get(k),list): return raw[k]
              return raw if isinstance(raw,list) else []

          def n(v):
              try: return int(v or 0)
              except Exception:
                  try: return int(float(v or 0))
                  except Exception: return 0

          def qtext(v, width=200):
              s=re.sub(r'\s+',' ',str(v or '')).strip().replace('|','\\|').replace('`',"'")
              return s if len(s)<=width else s[:width-1]+'…'

          dbs=[]
          mp=root/'database-map.tsv'
          if mp.exists():
              for line in mp.read_text().splitlines():
                  parts=line.split('\t')
                  if len(parts)>=2: dbs.append((parts[0],parts[1],parts[2] if len(parts)>2 else ''))

          print('# Club Actu — account-wide D1 query insights')
          print()
          print(f"Run: **{os.environ.get('RUN_ID','?')}**")
          print(f"Outcome: **{os.environ.get('INSIGHTS_OUTCOME','unknown')}**")
          print(f"Databases discovered: **{len(dbs)}**")
          print()
          print('Read-only control-plane analytics; no captured SQL is replayed.')

          print('\n## Database overview (top-query totals represented)\n')
          print('| Database | 1d rows represented | 7d rows represented | 1d fingerprints |')
          print('|---|---:|---:|---:|')
          overview=[]
          for safe,name,uid in dbs:
              one=load(root/'db'/f'{safe}-1d-total.json')
              seven=load(root/'db'/f'{safe}-7d-total.json')
              s1=sum(n(r.get('totalRowsRead')) for r in one if isinstance(r,dict))
              s7=sum(n(r.get('totalRowsRead')) for r in seven if isinstance(r,dict))
              overview.append((s1,s7,safe,name,one))
              print(f'| {name} | {s1:,} | {s7:,} | {len(one)} |')

          for s1,s7,safe,name,rows in sorted(overview, reverse=True):
              print(f'\n## {name} — top 1d row-read queries\n')
              if not rows:
                  print('_No 1d query insights returned._')
                  continue
              print('| # | total reads | avg reads | executions | efficiency | query |')
              print('|---:|---:|---:|---:|---:|---|')
              for i,r in enumerate(rows[:20],1):
                  print(f"| {i} | {n(r.get('totalRowsRead')):,} | {n(r.get('avgRowsRead')):,} | {n(r.get('numberOfTimesRun')):,} | {r.get('queryEfficiency','')} | `{qtext(r.get('query'))}` |")

          if not dbs:
              print('\n## Database listing failed or returned no databases\n')
              for fn in ('databases.stderr','databases.json'):
                  p=root/fn
                  if p.exists():
                      print(f'### {fn}\n```text\n{p.read_text()[-5000:]}\n```')

          if dbs and all(not rows for *_,rows in overview):
              print('\n## Diagnostic: insights empty for every database\n')
              print('Wrangler successfully listed the account databases, but no query fingerprint was returned. Inspecting the raw stderr/output artifacts is required; this can indicate analytics lag or query-insights availability rather than zero billable reads.')
          PY

      - name: Publish report to diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file d1-insights/summary.md

      - name: Upload raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-account-query-insights-${{ github.run_id }}
          path: d1-insights/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if Cloudflare control-plane commands failed
        if: steps.insights.outcome != 'success'
        run: exit 1
