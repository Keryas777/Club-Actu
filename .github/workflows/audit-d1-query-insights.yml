name: Audit D1 query insights

on:
  workflow_dispatch:
    inputs:
      time_period:
        description: "Wrangler insights period (for example 1d or 7d)"
        required: false
        default: "1d"
      limit:
        description: "Maximum queries per ranking"
        required: false
        default: "30"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-d1-query-insights.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: d1-query-insights-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Rank D1 queries by row reads
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN repository secret is missing."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID repository secret is missing."; exit 1; }

      - name: Fetch D1 query insights
        id: insights
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TIME_PERIOD: ${{ inputs.time_period || '1d' }}
          REQUESTED_LIMIT: ${{ inputs.limit || '30' }}
        run: |
          set -uo pipefail
          mkdir -p d1-insights

          LIMIT="$REQUESTED_LIMIT"
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then LIMIT=30; fi
          if [ "$LIMIT" -lt 5 ]; then LIMIT=5; fi
          if [ "$LIMIT" -gt 100 ]; then LIMIT=100; fi

          status=0
          run_insight() {
            local outfile="$1"; shift
            if ! npx wrangler d1 insights club-actu-db \
              --timePeriod "$TIME_PERIOD" "$@" \
              --limit "$LIMIT" --json > "d1-insights/${outfile}.json" 2> "d1-insights/${outfile}.stderr"; then
              status=1
            fi
          }

          # These commands query Cloudflare D1 analytics/insights. They do not
          # execute the listed SQL statements against the application database.
          run_insight total-reads --sort-type=sum --sort-by=reads --sort-direction=DESC
          run_insight avg-reads --sort-type=avg --sort-by=reads --sort-direction=DESC
          run_insight frequency --sort-type=sum --sort-by=count --sort-direction=DESC

          exit "$status"

      - name: Build audit summary
        if: always()
        env:
          TIME_PERIOD: ${{ inputs.time_period || '1d' }}
          INSIGHTS_OUTCOME: ${{ steps.insights.outcome }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p d1-insights
          python3 - <<'PY' | tee d1-insights/summary.md >> "$GITHUB_STEP_SUMMARY"
          import json, os, re
          from pathlib import Path

          root = Path('d1-insights')

          def load(name):
              path = root / name
              if not path.exists() or not path.read_text(encoding='utf-8').strip():
                  return []
              try:
                  raw = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return []
              if isinstance(raw, dict):
                  for key in ('result', 'results', 'data'):
                      if isinstance(raw.get(key), list):
                          return raw[key]
              return raw if isinstance(raw, list) else []

          def compact_query(q, width=220):
              q = re.sub(r'\s+', ' ', str(q or '')).strip()
              return q if len(q) <= width else q[:width-1] + '…'

          def num(v):
              try:
                  return int(v or 0)
              except Exception:
                  try: return round(float(v or 0), 2)
                  except Exception: return 0

          print('# Club Actu — D1 query insights')
          print()
          print(f"Run: **{os.environ.get('RUN_ID','?')}**")
          print(f"Period: **{os.environ.get('TIME_PERIOD','1d')}**")
          print(f"Insights command outcome: **{os.environ.get('INSIGHTS_OUTCOME','unknown')}**")
          print()
          print('This report is read-only analytics. It does not replay the SQL against D1.')

          rankings = [
              ('Top queries by TOTAL rows read', 'total-reads.json'),
              ('Top queries by AVERAGE rows read per execution', 'avg-reads.json'),
              ('Top queries by EXECUTION COUNT', 'frequency.json'),
          ]
          any_rows = False
          for title, filename in rankings:
              rows = load(filename)
              any_rows = any_rows or bool(rows)
              print(f'\n## {title}\n')
              if not rows:
                  print('_No parsed rows returned._')
                  continue
              print('| # | total rows read | avg rows read | executions | efficiency | query |')
              print('|---:|---:|---:|---:|---:|---|')
              for i, row in enumerate(rows[:30], 1):
                  query = compact_query(row.get('query')).replace('|', '\\|').replace('`', "'")
                  print(
                      f"| {i} | {num(row.get('totalRowsRead')):,} | "
                      f"{num(row.get('avgRowsRead')):,} | {num(row.get('numberOfTimesRun')):,} | "
                      f"{row.get('queryEfficiency', '')} | `{query}` |"
                  )

          totals = load('total-reads.json')
          if totals:
              known = sum(num(r.get('totalRowsRead')) for r in totals)
              print('\n## Sum represented by returned top queries\n')
              print(f'**{known:,} rows read** across the returned ranking entries.')
              print('This is not necessarily the complete account total if the ranking is truncated.')

          if not any_rows:
              print('\n## Wrangler diagnostics\n')
              for stem in ('total-reads', 'avg-reads', 'frequency'):
                  err = root / f'{stem}.stderr'
                  out = root / f'{stem}.json'
                  print(f'### {stem}')
                  if err.exists() and err.read_text(encoding='utf-8').strip():
                      print('```text')
                      print(err.read_text(encoding='utf-8')[-4000:])
                      print('```')
                  elif out.exists():
                      print('```text')
                      print(out.read_text(encoding='utf-8')[-4000:])
                      print('```')
                  else:
                      print('_No output file._')
          PY

      - name: Publish report to diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file d1-insights/summary.md

      - name: Upload raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-query-insights-${{ github.run_id }}
          path: |
            d1-insights/*
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if insights command failed
        if: steps.insights.outcome != 'success'
        run: exit 1
