name: Ops D1 residual reconciliation fix

on:
  push:
    branches:
      - codex/d1-optimize-residual-reconcile
    paths:
      - .github/workflows/ops-d1-reconcile-fix.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-optimize-residual-reconcile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Patch residual reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/phase-a-residuals.js')
          source = path.read_text()
          pattern = re.compile(
              r"async function reconcileStaleStatuses\(db, limit = 100\) \{.*?\n\}\n\nasync function loadResidualRoleCandidates",
              re.S,
          )
          replacement = '''async function reconcileStaleStatuses(db, limit = 100) {
            // Start from the tiny processing-status queue before joining historical
            // extraction/assessment tables. Without materialization SQLite may choose
            // article_extractions as the driving table and scan ~20k rows even when
            // only a handful of raw/phase_a_retry articles exist.
            const { results } = await db.prepare(
              `WITH candidates AS MATERIALIZED (
                 SELECT id, content_hash, source_id, last_seen_at
                 FROM raw_articles INDEXED BY idx_raw_articles_phase_a_queue
                 WHERE processing_status IN ('raw', 'phase_a_retry')
               )
               SELECT r.id AS article_id, r.content_hash AS source_content_hash,
                      SUM(CASE WHEN a.decision = 'relevant' THEN 1 ELSE 0 END) AS relevant,
                      SUM(CASE WHEN a.decision = 'needs_review' THEN 1 ELSE 0 END) AS needs_review,
                      SUM(CASE WHEN a.decision = 'rejected' THEN 1 ELSE 0 END) AS rejected,
                      COUNT(DISTINCT cs.club_id) AS expected_clubs,
                      COUNT(DISTINCT CASE WHEN a.id IS NOT NULL THEN cs.club_id END) AS assessed_clubs
               FROM candidates r
               JOIN club_sources cs ON cs.source_id = r.source_id
               JOIN clubs c ON c.id = cs.club_id AND c.active = 1
               LEFT JOIN article_club_assessments a
                 ON a.article_id = r.id
                AND a.club_id = cs.club_id
                AND a.source_content_hash = r.content_hash
                AND a.rule_version = ?
               WHERE EXISTS (
                 SELECT 1
                 FROM article_extractions e
                 WHERE e.article_id = r.id
                   AND e.source_content_hash = r.content_hash
                   AND e.extractor_version = ?
                   AND e.status = 'completed'
               )
               GROUP BY r.id, r.content_hash, r.last_seen_at
               HAVING expected_clubs = assessed_clubs
               ORDER BY r.last_seen_at ASC
               LIMIT ?`
            ).bind(RULE_VERSION, EXTRACTOR_VERSION, limit).all();

            let reconciled = 0;
            for (const row of results || []) {
              const status = statusFromAssessmentCounts(row);
              const change = await db.prepare(
                `UPDATE raw_articles
                 SET processing_status = ?
                 WHERE id = ? AND processing_status <> ?`
              ).bind(status, row.article_id, status).run();
              if (Number(change?.meta?.changes || 0) > 0) reconciled++;
            }

            return { reconciled, scanned: (results || []).length };
          }

          async function loadResidualRoleCandidates'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'expected one reconcileStaleStatuses block, replaced {count}')
          path.write_text(updated)
          PY

      - name: Validate
        run: |
          set -euo pipefail
          node --check src/phase-a-residuals.js
          npm test

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ops-d1-reconcile-fix.yml
          git add src/phase-a-residuals.js
          git commit -m 'D1: reduce residual reconciliation row reads'
          git push origin HEAD:codex/d1-optimize-residual-reconcile
