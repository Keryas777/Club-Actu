name: Audit D1 STORY CTE worst case 2026-10-05

on:
  push:
    branches:
      - ops/d1-story-fanout-audit-20261005
    paths:
      - ".github/workflows/audit-d1-story-cte-worstcase-20261005.yml"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Benchmark candidate STORY CTE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p d1-story-cte
          SQL="WITH event_keys(key_type,key_value) AS (VALUES ('club','olympique lyonnais'),('salient','pour'),('salient','avec'),('salient','apres'),('salient','dans'),('salient','sport'),('salient','face'),('salient','deja')) SELECT s.id,s.family,COUNT(*) AS matched_key_count FROM event_keys q JOIN story_index_keys AS k INDEXED BY idx_story_index_keys_lookup ON k.key_type=q.key_type AND k.key_value=q.key_value JOIN stories s ON s.id=k.story_id WHERE s.status='active' AND s.merged_into_story_id IS NULL GROUP BY s.id ORDER BY matched_key_count DESC,COALESCE(s.last_event_at,s.created_at) DESC,s.id ASC LIMIT 64"
          npx --yes wrangler@4 d1 execute DB --remote --json --command "$SQL" > d1-story-cte/candidates.json
      - name: Benchmark qualified-members CTE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/candidate_ids.txt
          import json
          raw=json.load(open('d1-story-cte/candidates.json'))
          rows=[]
          for x in raw if isinstance(raw,list) else [raw]: rows.extend((x or {}).get('results') or [])
          print(','.join("'"+str(r['id']).replace("'","''")+"'" for r in rows[:64]))
          PY
          IDS=$(cat /tmp/candidate_ids.txt)
          if [ -z "$IDS" ]; then IDS="'__none__'"; fi
          SQL="WITH q(rule_type,key_type,key_value) AS (VALUES ('club','club','olympique lyonnais'),('salient','salient','pour'),('salient','salient','avec'),('salient','salient','apres'),('salient','salient','dans'),('salient','salient','sport'),('salient','salient','face'),('salient','salient','deja')), candidate_story_ids(story_id) AS (SELECT id FROM stories WHERE id IN ($IDS)), hits AS (SELECT ik.story_id,ik.event_id,m.article_id,m.published_at,m.family,MAX(CASE WHEN q.rule_type='person' THEN 1 ELSE 0 END) AS person_hit,COUNT(DISTINCT CASE WHEN q.rule_type='club' THEN q.key_value END) AS club_hits,MAX(CASE WHEN q.rule_type='relation' THEN 1 ELSE 0 END) AS relation_hit,COUNT(DISTINCT CASE WHEN q.rule_type='salient' THEN q.key_value END) AS salient_hits FROM q JOIN story_event_index_keys AS ik INDEXED BY idx_story_event_index_keys_lookup ON ik.key_type=q.key_type AND ik.key_value=q.key_value JOIN candidate_story_ids csi ON csi.story_id=ik.story_id JOIN story_events se ON se.story_id=ik.story_id AND se.event_id=ik.event_id AND se.membership_status='active' JOIN event_candidates m ON m.id=ik.event_id WHERE m.lifecycle_status='active' AND m.article_id<>'__none__' GROUP BY ik.story_id,ik.event_id), qualified AS (SELECT * FROM hits WHERE person_hit>0 OR relation_hit>0 OR club_hits>=2 OR salient_hits>=4 OR (family='transfer' AND (salient_hits>=3 OR (club_hits>=1 AND salient_hits>=2)))), ranked AS (SELECT qualified.*,COUNT(*) OVER (PARTITION BY story_id) AS qualified_count,ROW_NUMBER() OVER (PARTITION BY story_id ORDER BY person_hit DESC,relation_hit DESC,club_hits DESC,salient_hits DESC,COALESCE(published_at,'') DESC,event_id ASC) AS rn FROM qualified) SELECT * FROM ranked WHERE rn<=12 ORDER BY story_id ASC,rn ASC"
          npx --yes wrangler@4 d1 execute DB --remote --json --command "$SQL" > d1-story-cte/members.json
      - name: Report
        run: |
          python3 - <<'PY' | tee d1-story-cte/report.md >> "$GITHUB_STEP_SUMMARY"
          import json
          def load(path):
              raw=json.load(open(path)); xs=raw if isinstance(raw,list) else [raw]
              rows=[]; reads=0
              for x in xs:
                  rows += (x or {}).get('results') or []
                  reads += int(((x or {}).get('meta') or {}).get('rows_read') or 0)
              return rows,reads
          c,cr=load('d1-story-cte/candidates.json')
          m,mr=load('d1-story-cte/members.json')
          print('# STORY CTE worst-case benchmark — 2026-10-05')
          print()
          print('Read-only. Uses OL plus the highest-fanout salient keys observed in the current index; deliberately harsher than a normal discriminant-token set.')
          print()
          print(f'- candidate STORY CTE: **{cr:,} rows_read**, {len(c)} result stories')
          print(f'- qualified-members CTE: **{mr:,} rows_read**, {len(m)} result rows')
          print(f'- combined: **{cr+mr:,} rows_read**')
          PY
      - name: Comment investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file d1-story-cte/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: d1-story-cte-${{ github.run_id }}
          path: d1-story-cte/**
          retention-days: 7
