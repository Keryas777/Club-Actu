name: Ops apply final closure-status fix

on:
  push:
    branches:
      - codex/d1-guard-optimize-closure-status
    paths:
      - .github/workflows/ops-d1-closure-fix-final.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-guard-optimize-closure-status
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('src/index-phase-a-fix.js')
          text = index_path.read_text()
          start_marker = '    if (url.pathname === "/api/phase-a-closure-status" && request.method === "GET") {'
          next_marker = '    if (url.pathname === "/api/repair-phase-a-residuals" && request.method === "POST") {'
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          replacement = '''    if (url.pathname === "/api/phase-a-closure-status" && request.method === "GET") {
      if (!env.DB) return json({ ok: false, error: "D1 binding DB missing" }, { status: 503 });
      if (!env.MANUAL_TRIGGER_TOKEN) {
        return json({ ok: false, error: "Manual trigger not configured" }, { status: 503 });
      }
      const token = bearerToken(request);
      if (!token || token !== env.MANUAL_TRIGGER_TOKEN) {
        return json({ ok: false, error: "Unauthorized" }, { status: 401 });
      }
      const result = await getPhaseAClosureStatusFixed(env.DB);
      return json({ ok: true, ...result });
    }

'''
          index_path.write_text(text[:start] + replacement + text[end:])

          residual_path = Path('src/phase-a-residuals.js')
          text = residual_path.read_text()
          marker = 'export async function getPhaseAClosureStatusFixed(db) {'
          start = text.index(marker)
          new_func = Path('tmp/closure-status-function.txt').read_text().rstrip() + '\n'
          residual_path.write_text(text[:start] + new_func)
          PY

          cat > test/closure-status-auth.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import worker from "../src/index-phase-a-fix.js";

          test("closure status rejects anonymous callers before touching D1", async () => {
            const DB = { prepare() { throw new Error("D1 must not be queried"); } };
            const response = await worker.fetch(
              new Request("https://example.test/api/phase-a-closure-status"),
              { DB, MANUAL_TRIGGER_TOKEN: "secret" },
              {}
            );
            assert.equal(response.status, 401);
            assert.deepEqual(await response.json(), { ok: false, error: "Unauthorized" });
          });

          test("closure status fails closed when auth is not configured", async () => {
            const DB = { prepare() { throw new Error("D1 must not be queried"); } };
            const response = await worker.fetch(
              new Request("https://example.test/api/phase-a-closure-status"),
              { DB },
              {}
            );
            assert.equal(response.status, 503);
            assert.deepEqual(await response.json(), { ok: false, error: "Manual trigger not configured" });
          });
          EOF
      - name: Validate
        run: |
          set -euo pipefail
          node --check src/index-phase-a-fix.js
          node --check src/phase-a-residuals.js
          git diff --check
          npm test
      - name: Commit clean patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ops-d1-closure-fix.yml || true
          git rm -f .github/workflows/ops-d1-closure-fix-v2.yml || true
          git rm -f .github/workflows/ops-d1-closure-fix-final.yml || true
          git rm -f tmp/closure-status-function.txt || true
          git add src/index-phase-a-fix.js src/phase-a-residuals.js test/closure-status-auth.test.js
          git commit -m "D1: guard and optimize closure status"
          git push origin HEAD:codex/d1-guard-optimize-closure-status
