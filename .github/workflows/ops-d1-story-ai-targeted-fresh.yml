name: Ops D1.2 cited evidence audit

on:
  push:
    branches:
      - codex/d1-story-ai-smoke
    paths:
      - .github/workflows/ops-d1-story-ai-targeted-fresh.yml

permissions:
  contents: read

jobs:
  cohort:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit all cited evidence for V4 cohort
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ids='1492,1474,1516,1517,1518,1520,1521,1524,1525,1526,1528,1529,1530,1531'
          npx wrangler d1 execute DB --remote --command "
          WITH aa AS (
            SELECT id attempt_id,event_id,best_story_id,best_hybrid_score,candidates_json,ai_response_json
            FROM story_match_attempts
            WHERE id IN ($ids) AND ai_status='review_pending'
          ),
          chosen AS (
            SELECT aa.attempt_id,
                   json_extract(aa.ai_response_json,'$.story_id') ai_story_id,
                   json_extract(c.value,'$.hybrid') chosen_hybrid,
                   json_extract(c.value,'$.embedding') chosen_embedding,
                   json_extract(c.value,'$.lexical') chosen_lexical,
                   json_extract(c.value,'$.temporal') chosen_temporal
            FROM aa
            LEFT JOIN json_each(aa.candidates_json) c
              ON json_extract(c.value,'$.story_id')=json_extract(aa.ai_response_json,'$.story_id')
          ),
          ev AS (
            SELECT aa.attempt_id,
                   aa.event_id incoming_event_id,
                   json_extract(aa.ai_response_json,'$.decision') ai_decision,
                   json_extract(aa.ai_response_json,'$.story_id') ai_story_id,
                   json_extract(aa.ai_response_json,'$.confidence') confidence,
                   json_extract(aa.ai_response_json,'$.rationale') rationale,
                   j.value cited_event_id
            FROM aa, json_each(json_extract(aa.ai_response_json,'$.evidence_event_ids')) j
          )
          SELECT ev.attempt_id,ev.incoming_event_id,ev.ai_decision,ev.ai_story_id,
                 ev.confidence,ev.rationale,
                 chosen.chosen_hybrid,chosen.chosen_embedding,chosen.chosen_lexical,chosen.chosen_temporal,
                 ev.cited_event_id,
                 CASE WHEN ev.cited_event_id=ev.incoming_event_id THEN 'incoming' ELSE 'representative' END evidence_role,
                 e.family,e.stage,e.primary_people_json people,e.primary_clubs_json clubs,
                 r.source_id,r.title,substr(e.evidence_json,1,2200) evidence
          FROM ev
          LEFT JOIN chosen ON chosen.attempt_id=ev.attempt_id
          LEFT JOIN event_candidates e ON e.id=ev.cited_event_id
          LEFT JOIN raw_articles r ON r.id=e.article_id
          ORDER BY ev.attempt_id DESC,evidence_role,ev.cited_event_id;"
