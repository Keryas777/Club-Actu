name: Ops D1.2 Cherki candidate root-cause audit

on:
  push:
    branches:
      - codex/d1-story-ai-smoke
    paths:
      - .github/workflows/ops-d1-story-ai-targeted-fresh.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Inspect Cherki duplicate EVENTs and missing STORY candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '=== CHERKI SAME-ARTICLE EVENTS ==='
          npx wrangler d1 execute DB --remote --command "
          SELECT e.id event_id,e.article_id,e.family,e.stage,e.primary_people_json people,e.primary_clubs_json clubs,
                 e.relation_from,e.relation_to,e.competition,e.opponents_json,e.lexical_tokens_json,
                 r.source_id,r.title,substr(e.evidence_json,1,2600) evidence
          FROM event_candidates e
          JOIN raw_articles r ON r.id=e.article_id
          WHERE e.id IN (
            '81aef80d1dec196224bd7797fb185361e6ebc60cf99f4d56704cdaf1274cb82d',
            '3a85a30899f41c165b47d6b6e5af8d91c03c36956c2066c8e06a21c646fe5a64'
          )
          ORDER BY e.id;"

          echo '=== CORRECT CHERKI STORY MEMBERS ==='
          npx wrangler d1 execute DB --remote --command "
          SELECT se.story_id,se.event_id,se.assignment_kind,e.article_id,e.family,e.stage,
                 e.primary_people_json people,e.primary_clubs_json clubs,
                 e.relation_from,e.relation_to,e.competition,e.opponents_json,e.lexical_tokens_json,
                 r.source_id,r.title,substr(e.evidence_json,1,2200) evidence
          FROM story_events se
          JOIN event_candidates e ON e.id=se.event_id
          JOIN raw_articles r ON r.id=e.article_id
          WHERE se.story_id='ec8454ec664e9786a4ae1897eae087535dec1fb514b2cfe132627344f3b02f50'
            AND se.membership_status='active'
          ORDER BY se.assigned_at,se.event_id;"

          echo '=== CORRECT CHERKI STORY INDEX KEYS ==='
          npx wrangler d1 execute DB --remote --command "
          SELECT key_type,key_value
          FROM story_index_keys
          WHERE story_id='ec8454ec664e9786a4ae1897eae087535dec1fb514b2cfe132627344f3b02f50'
          ORDER BY key_type,key_value;"

          echo '=== ATTEMPT 1557 CANDIDATES ==='
          npx wrangler d1 execute DB --remote --command "
          SELECT id,event_id,best_story_id,best_hybrid_score,substr(candidates_json,1,16000) candidates_json
          FROM story_match_attempts
          WHERE id=1557;"
