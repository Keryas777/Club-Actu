name: Ops D1.2 V5 candidate audit

on:
  push:
    branches:
      - codex/d1-story-ai-smoke
    paths:
      - .github/workflows/ops-d1-story-ai-targeted-fresh.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit V5 candidate snapshots and representative members
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ids='1471,1443,1533,1534,1535,1536,1537,1539,1540,1541,1542,1543,1544,1545,1547,1548,1549'
          echo '=== V5 CANDIDATE MEMBERS ==='
          npx wrangler d1 execute DB --remote --command "
          WITH attempts AS (
            SELECT id attempt_id,event_id,ai_response_json,candidates_json
            FROM story_match_attempts
            WHERE id IN ($ids)
          ),
          cand AS (
            SELECT attempts.attempt_id,attempts.event_id,
                   CAST(c.key AS INTEGER) candidate_rank,
                   json_extract(c.value,'$.story_id') story_id,
                   json_extract(c.value,'$.shortlist_pass') shortlist_pass,
                   json_extract(c.value,'$.family_compatible') family_compatible,
                   json_extract(c.value,'$.hybrid') hybrid,
                   json_extract(c.value,'$.embedding') embedding,
                   json_extract(c.value,'$.lexical') lexical,
                   json_extract(c.value,'$.temporal') temporal,
                   c.value candidate_json,
                   json_extract(attempts.ai_response_json,'$.decision') ai_decision,
                   json_extract(attempts.ai_response_json,'$.story_id') ai_story_id
            FROM attempts,json_each(attempts.candidates_json) c
            WHERE CAST(c.key AS INTEGER)<4
          ),
          members AS (
            SELECT cand.*,
                   CAST(m.key AS INTEGER) member_rank,
                   json_extract(m.value,'$.event_id') member_event_id
            FROM cand
            LEFT JOIN json_each(json_extract(cand.candidate_json,'$.shortlist_members')) m
              ON CAST(m.key AS INTEGER)<3
          )
          SELECT members.attempt_id,members.ai_decision,members.ai_story_id,
                 members.candidate_rank,members.story_id,members.shortlist_pass,members.family_compatible,
                 members.hybrid,members.embedding,members.lexical,members.temporal,
                 members.member_rank,members.member_event_id,
                 e.family member_family,e.stage member_stage,e.primary_people_json member_people,
                 e.primary_clubs_json member_clubs,e.relation_from member_from,e.relation_to member_to,
                 r.source_id member_source,r.title member_title,
                 substr(e.evidence_json,1,2200) member_evidence
          FROM members
          LEFT JOIN event_candidates e ON e.id=members.member_event_id
          LEFT JOIN raw_articles r ON r.id=e.article_id
          ORDER BY members.attempt_id DESC,members.candidate_rank,members.member_rank;"
