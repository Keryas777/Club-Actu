name: Apply D1 STORY candidate query optimization

on:
  push:
    branches:
      - fix/d1-story-candidate-preaggregate
    paths:
      - ".github/workflows/apply-d1-story-candidate-preaggregate.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1-story-candidate-preaggregate
      - name: Patch loadStoryCandidates query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/story-match-store.js')
          text = p.read_text()
          old = """    WITH event_keys AS (\n      SELECT\n        json_extract(value, '$.key_type') AS key_type,\n        json_extract(value, '$.key_value') AS key_value\n      FROM json_each(?)\n    )\n    SELECT\n      s.id,\n      s.founder_event_id,\n      s.family,\n      s.status,\n      s.boundary_event_id,\n      s.first_event_at,\n      s.last_event_at,\n      s.member_count,\n      s.centroid_blob,\n      s.centroid_model,\n      s.centroid_embedding_version,\n      s.centroid_dimension,\n      s.centroid_encoding,\n      s.centroid_member_count,\n      s.centroid_revision,\n      COUNT(*) AS matched_key_count\n    FROM event_keys q\n    JOIN story_index_keys AS k INDEXED BY idx_story_index_keys_lookup\n      ON k.key_type = q.key_type\n     AND k.key_value = q.key_value\n    JOIN stories s ON s.id = k.story_id\n    WHERE s.status = 'active'\n      AND s.merged_into_story_id IS NULL\n    GROUP BY s.id\n    ORDER BY matched_key_count DESC, COALESCE(s.last_event_at, s.created_at) DESC, s.id ASC\n    LIMIT ?\n"""
          new = """    WITH event_keys AS MATERIALIZED (\n      SELECT\n        json_extract(value, '$.key_type') AS key_type,\n        json_extract(value, '$.key_value') AS key_value\n      FROM json_each(?)\n    ),\n    matched AS MATERIALIZED (\n      SELECT\n        k.story_id,\n        COUNT(*) AS matched_key_count\n      FROM event_keys q\n      CROSS JOIN story_index_keys AS k INDEXED BY idx_story_index_keys_lookup\n        ON k.key_type = q.key_type\n       AND k.key_value = q.key_value\n      GROUP BY k.story_id\n    )\n    SELECT\n      s.id,\n      s.founder_event_id,\n      s.family,\n      s.status,\n      s.boundary_event_id,\n      s.first_event_at,\n      s.last_event_at,\n      s.member_count,\n      s.centroid_blob,\n      s.centroid_model,\n      s.centroid_embedding_version,\n      s.centroid_dimension,\n      s.centroid_encoding,\n      s.centroid_member_count,\n      s.centroid_revision,\n      m.matched_key_count\n    FROM matched m\n    JOIN stories s ON s.id = m.story_id\n    WHERE s.status = 'active'\n      AND s.merged_into_story_id IS NULL\n    ORDER BY m.matched_key_count DESC, COALESCE(s.last_event_at, s.created_at) DESC, s.id ASC\n    LIMIT ?\n"""
          if old not in text:
              raise SystemExit('Expected loadStoryCandidates SQL block not found; refusing to patch')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one SQL block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/story-match-store.js
          git diff --cached --check
          git commit -m "Fix D1 STORY candidate query amplification"
          git push origin HEAD:fix/d1-story-candidate-preaggregate
