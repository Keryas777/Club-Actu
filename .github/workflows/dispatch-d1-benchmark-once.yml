name: Dispatch D1 benchmark once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-d1-benchmark-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run audit-d1-hot-query-benchmark.yml --repo "$GITHUB_REPOSITORY" --ref main
