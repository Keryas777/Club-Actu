name: Repair EVENT embedding storage

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum legacy TEXT embeddings to repair (1-50)"
        required: false
        default: "20"

permissions:
  contents: read

concurrency:
  group: repair-event-embedding-storage
  cancel-in-progress: false

jobs:
  repair:
    name: Repair legacy embedding TEXT rows
    runs-on: ubuntu-latest

    steps:
      - name: Check manual trigger secret
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MANUAL_TRIGGER_TOKEN" || { echo "MANUAL_TRIGGER_TOKEN repository secret is missing."; exit 1; }

      - name: Repair bounded embedding batch
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          BASE_URL: https://club-actu.deliriousfan7.workers.dev
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error \
              --output embedding-storage-repair.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MANUAL_TRIGGER_TOKEN" \
              --header "Accept: application/json" \
              "$BASE_URL/api/repair-event-embedding-storage?limit=${LIMIT:-20}"
          )"

          echo "HTTP $status"
          cat embedding-storage-repair.json
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('embedding-storage-repair.json',encoding='utf-8'))
          if d.get('ok') is not True: raise SystemExit('Worker returned ok != true')
          print('# Club Actu — embedding storage repair')
          print()
          for k in ['scanned','repaired','requeued','failed','writes_executed','rows_read','rows_written']:
              print(f'- {k}: **{int(d.get(k) or 0)}**')
          print()
          print(json.dumps(d.get('examples') or [],ensure_ascii=False,indent=2))
          PY
