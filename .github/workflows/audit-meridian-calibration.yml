name: Audit Meridian story calibration

on:
  workflow_dispatch:
    inputs:
      phase_b_run_id:
        description: Successful Phase B audit run to calibrate against
        required: false
        default: '34347651580'
      sample_size:
        description: Ground-truth review sample size
        required: false
        default: '120'

permissions:
  actions: read
  contents: read

concurrency:
  group: meridian-story-calibration-manual
  cancel-in-progress: false

jobs:
  calibration:
    name: Build stratified Meridian calibration sample
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download reproducible Phase B source artifact
        uses: actions/download-artifact@v4
        with:
          name: phase-b-event-extraction-${{ inputs.phase_b_run_id || '34347651580' }}
          path: phase-b-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.phase_b_run_id || '34347651580' }}

      - name: Validate source and Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for club in ol psg om; do
            test -s "phase-b-source/${club}.json" || { echo "Missing ${club}.json in Phase B artifact"; exit 1; }
          done
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository secret CLOUDFLARE_WORKERS_AI_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build calibration sample with BGE-M3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/calibrate-meridian-story-thresholds.mjs \
            --source-dir phase-b-source \
            --out-dir phase-b-meridian-calibration \
            --sample-size "${{ inputs.sample_size || '120' }}"

      - name: Print calibration summary
        env:
          PHASE_B_RUN_ID: ${{ inputs.phase_b_run_id || '34347651580' }}
        run: |
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync('phase-b-meridian-calibration/summary.json', 'utf8'));
          console.log('# Club Actu — Meridian story calibration');
          console.log();
          console.log(`Phase B source run: \`${process.env.PHASE_B_RUN_ID}\``);
          console.log(`Model: \`${s.model}\` · representation: \`${s.representation}\``);
          console.log(`Unique EVENT_CANDIDATE: **${s.unique_events}**`);
          console.log(`Football-shortlisted pairs: **${s.shortlisted_pairs}**`);
          console.log(`Ground-truth review sample: **${s.sample_size}**`);
          console.log();
          console.log('| Score bin | Available | Selected |');
          console.log('|---|---:|---:|');
          for (const [name, row] of Object.entries(s.sample_bins || {})) {
            console.log(`| ${name} | ${row.available} | ${row.selected} |`);
          }
          console.log();
          console.log('Artifact files include every shortlisted structured pair plus a deterministic stratified review sample with blank same/different labels.');
          console.log('Audit-only: no D1 writes, no story writes, no production clustering, no cron.');
          NODE

      - name: Upload calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-story-calibration-${{ github.run_id }}
          path: phase-b-meridian-calibration/
          if-no-files-found: warn
          retention-days: 30
