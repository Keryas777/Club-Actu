name: Ops enable STORY cron

on:
  push:
    branches:
      - codex/enable-story-cron
    paths:
      - .github/workflows/ops-enable-story-cron.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/enable-story-cron
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Patch scheduled STORY integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/index-phase-a-fix.js')
          text = path.read_text()

          helper_anchor = 'async function eventEmbeddingStorageRepairEndpoint(request, env, url) {'
          if 'async function scheduledStoryMatching(env)' not in text:
              helper = '''async function scheduledStoryMatching(env) {
            if (!env.DB) return null;
            try {
              const { processStoryMatchBatch } = await import("./story-matcher.js");
              const rawLimit = Number(env.STORY_MATCH_BATCH_LIMIT || 4);
              const limit = Number.isFinite(rawLimit)
                ? Math.max(1, Math.min(8, Math.trunc(rawLimit)))
                : 4;
              const result = await processStoryMatchBatch(env.DB, {
                limit,
                maxDurationMs: Number(env.STORY_MATCH_MAX_DURATION_MS || 12000)
              });
              console.log("story-match-batch", result);
              return result;
            } catch (error) {
              const name = error instanceof Error ? error.name : "Error";
              const message = error instanceof Error ? error.message : String(error);
              // STORY matching must never break collection / Phase A / EVENT / embeddings.
              console.error("story-match-batch failed", { name, message });
              return { ok: false, name, message };
            }
          }

          '''
              if helper_anchor not in text:
                  raise SystemExit('helper anchor not found')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_comment = '''    // Preserve collection + Phase A, then run the already-validated bounded EVENT
              // persistence and embedding queues independently. STORY matching remains manual
              // until its real D1 smoke test is validated.'''
          new_comment = '''    // Preserve collection + Phase A, then run the validated bounded EVENT persistence,
              // embedding and STORY queues independently. Each queue owns its own failure boundary.'''
          if old_comment not in text:
              raise SystemExit('scheduled comment anchor not found')
          text = text.replace(old_comment, new_comment, 1)

          old_tail = '''    // Embeddings run independently. EVENTs created in this same cron may wait
              // until the next cycle, which keeps the pipeline bounded and loosely coupled.
              ctx.waitUntil(scheduledEventEmbeddings(env));'''
          new_tail = '''    // Downstream queues run independently. EVENTs created or embedded in this same cron
              // may wait until the next cycle, which keeps the pipeline bounded and loosely coupled.
              ctx.waitUntil(scheduledEventEmbeddings(env));
              ctx.waitUntil(scheduledStoryMatching(env));'''
          if old_tail not in text:
              raise SystemExit('scheduled tail anchor not found')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY
      - name: Verify syntax and tests
        run: |
          node --check src/index-phase-a-fix.js
          npm test
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/ops-enable-story-cron.yml
          git add src/index-phase-a-fix.js .github/workflows/ops-enable-story-cron.yml
          git commit -m "D1: enable bounded STORY matching in cron"
          git push origin HEAD:codex/enable-story-cron
