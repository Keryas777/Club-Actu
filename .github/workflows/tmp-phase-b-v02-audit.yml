name: Temporary Phase B v0.2 audit

on:
  push:
    branches:
      - phase-b-2-1-2-benchmark

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch v0.2 previews
        env:
          BASE_URL: https://club-actu.deliriousfan7.workers.dev
        run: |
          set -euo pipefail
          mkdir -p phase-b-v02-audit
          for club in ol psg om; do
            curl --fail-with-body --silent --show-error \
              "$BASE_URL/api/phase-b-event-preview?club=$club&limit=60" \
              -o "phase-b-v02-audit/$club.json"
          done

      - name: Print v0.2 summary
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('# Phase B event extraction v0.2')
          print()
          print('| Club | Version | Articles | Events | Multi | Multi rate | Unknown | No person | Body events | Body rate |')
          print('|---|---|---:|---:|---:|---:|---:|---:|---:|---:|')
          for club in ('ol','psg','om'):
              d=json.loads(Path(f'phase-b-v02-audit/{club}.json').read_text())
              print(f"| {club.upper()} | {d.get('version')} | {d.get('article_count',0)} | {d.get('event_count',0)} | {d.get('articles_with_multiple_events',0)} | {d.get('multi_event_rate',0):.1%} | {d.get('unknown_family_rate',0):.1%} | {d.get('events_without_primary_people',0)} | {d.get('body_event_count',0)} | {d.get('body_event_rate',0):.1%} |")
          PY

      - name: Upload v0.2 JSON
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-v02-audit-${{ github.run_id }}
          path: phase-b-v02-audit/*.json
          if-no-files-found: error
          retention-days: 7
