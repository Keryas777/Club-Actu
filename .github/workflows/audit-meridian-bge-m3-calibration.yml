name: Audit Meridian BGE-M3 calibration corpus

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Relevant articles per club
        required: false
        default: '60'
      phase_b_run_id:
        description: Successful Phase B event-audit run to benchmark
        required: false
        default: '34347651580'

permissions:
  actions: read
  contents: read

concurrency:
  group: meridian-bge-m3-calibration-manual
  cancel-in-progress: false

jobs:
  benchmark:
    name: Export every football-shortlisted structured pair
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download reproducible Phase B source artifact
        uses: actions/download-artifact@v4
        with:
          name: phase-b-event-extraction-${{ inputs.phase_b_run_id || '34347651580' }}
          path: phase-b-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.phase_b_run_id || '34347651580' }}

      - name: Validate source and Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for club in ol psg om; do
            test -s "phase-b-source/${club}.json" || { echo "Missing ${club}.json"; exit 1; }
          done
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_WORKERS_AI_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build full structured benchmark corpus
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/benchmark-meridian-bge-m3-calibration.mjs \
            --source-dir phase-b-source \
            --out-dir phase-b-meridian \
            --limit "${{ inputs.limit || '60' }}"

      - name: Print benchmark summary
        env:
          PHASE_B_RUN_ID: ${{ inputs.phase_b_run_id || '34347651580' }}
        run: |
          node --input-type=module <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync('phase-b-meridian/summary.json', 'utf8'));
          console.log('# Club Actu — Meridian full calibration corpus');
          console.log();
          console.log(`Phase B source run: \`${process.env.PHASE_B_RUN_ID}\``);
          console.log(`Model: \`${s.model}\` · representation: \`${s.representation}\``);
          console.log(`Unique EVENT_CANDIDATE: **${s.unique_events}**`);
          console.log(`Possible cross-article pairs: **${s.possible_pairs}**`);
          console.log(`Football-shortlisted pairs exported: **${s.shortlisted_pairs}**`);
          console.log(`Reduction before semantic scoring: **${(100 * s.reduction_rate).toFixed(1)}%**`);
          console.log(`Hybrid score range: **${s.score_range.min?.toFixed(4)} → ${s.score_range.max?.toFixed(4)}**`);
          console.log();
          console.log('The artifact exports every shortlisted pair, not only the previous top 160.');
          console.log('Audit-only: no D1 writes, no story writes, no production clustering and no cron.');
          NODE

      - name: Upload complete benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-bge-m3-benchmark-${{ github.run_id }}
          path: phase-b-meridian/
          if-no-files-found: warn
          retention-days: 30
