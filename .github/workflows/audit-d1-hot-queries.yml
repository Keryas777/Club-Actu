name: Audit D1 automatic hot queries

on:
  workflow_dispatch:
  schedule:
    # Diagnostic safety net: the 2026 incident resets at 00:00 UTC on Oct 3.
    # Keep the manual trigger as the normal entry point; remove this calendar
    # trigger after the current incident is resolved.
    - cron: '17 0 3 10 *'

permissions:
  contents: read
  issues: write

concurrency:
  group: d1-hot-query-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measure automatic D1 SELECT costs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Measure production hot-query selectors
        id: benchmark
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scripts/audit-d1-hot-queries.mjs | tee benchmark-console.txt

      - name: Publish benchmark to diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f d1-hot-query-audit/summary.md ]; then
            {
              echo "Run: **${GITHUB_RUN_ID}**"
              echo
              cat d1-hot-query-audit/summary.md
            } > d1-hot-query-audit/issue-report.md
          else
            {
              echo "# Club Actu — D1 automatic hot-query benchmark"
              echo
              echo "Run: **${GITHUB_RUN_ID}**"
              echo
              echo "The benchmark did not produce a summary."
              echo
              echo '```text'
              tail -c 12000 benchmark-console.txt 2>/dev/null || true
              echo
              echo '```'
            } > d1-hot-query-audit/issue-report.md
          fi
          gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file d1-hot-query-audit/issue-report.md

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-hot-query-benchmark-${{ github.run_id }}
          path: |
            d1-hot-query-audit/*
            benchmark-console.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if benchmark failed
        if: steps.benchmark.outcome != 'success'
        run: exit 1
