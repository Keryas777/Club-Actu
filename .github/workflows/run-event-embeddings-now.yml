name: Run EVENT embeddings now

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-embeddings-manual
  cancel-in-progress: false

jobs:
  run:
    name: Embed bounded EVENT batch
    runs-on: ubuntu-latest

    steps:
      - name: Check manual trigger secret
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MANUAL_TRIGGER_TOKEN" ]; then
            echo "MANUAL_TRIGGER_TOKEN repository secret is missing."
            exit 1
          fi

      - name: Run one bounded EVENT embedding batch
        env:
          MANUAL_TRIGGER_TOKEN: ${{ secrets.MANUAL_TRIGGER_TOKEN }}
          BASE_URL: https://club-actu.deliriousfan7.workers.dev
        run: |
          set -euo pipefail

          status="$(
            curl --silent --show-error \
              --output event-embedding-batch.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MANUAL_TRIGGER_TOKEN" \
              --header "Accept: application/json" \
              "$BASE_URL/api/process-event-embedding-batch?limit=4"
          )"

          echo "HTTP $status"
          cat event-embedding-batch.json
          echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          data = json.load(open("event-embedding-batch.json", encoding="utf-8"))
          if data.get("ok") is not True:
              raise SystemExit("Worker returned ok != true")

          print("# Club Actu — EVENT embeddings")
          print()
          print(f'- Model: **{data.get("model") or "unknown"}**')
          print(f'- Version: **{data.get("embedding_version") or "unknown"}**')
          print(f'- Dimension: **{int(data.get("dimension") or 0)}**')
          print(f'- Candidates: **{int(data.get("candidates") or 0)}**')
          print(f'- Claimed: **{int(data.get("claimed") or 0)}**')
          print(f'- Embedded: **{int(data.get("embedded") or 0)}**')
          print(f'- Reused: **{int(data.get("reused") or 0)}**')
          print(f'- Deferred: **{int(data.get("deferred") or 0)}**')
          print(f'- Retry: **{int(data.get("retry") or 0)}**')
          print(f'- Failed: **{int(data.get("failed") or 0)}**')
          print(f'- Workers AI calls: **{int(data.get("ai_calls") or 0)}**')
          print(f'- D1 writes/statements: **{int(data.get("writes_executed") or 0)}**')
          print(f'- Stop reason: **{data.get("stop_reason") or "unknown"}**')
          print()
          print("```json")
          print(json.dumps(data.get("examples") or [], ensure_ascii=False, indent=2))
          print("```")
          PY
