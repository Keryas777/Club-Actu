name: Audit D1 STORY real events 2026-10-05

on:
  push:
    branches:
      - ops/d1-story-fanout-audit-20261005
    paths:
      - ".github/workflows/audit-d1-story-real-events-20261005.yml"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select recent real matched events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p d1-story-real
          SQL="SELECT e.id,e.article_id,e.language,e.family,e.primary_people_json,e.primary_clubs_json,e.relation_from,e.relation_to,e.competition,e.opponents_json,e.lexical_tokens_json,e.match_status,e.updated_at,COALESCE((SELECT json_array_length(a.candidates_json) FROM story_match_attempts a WHERE a.event_id=e.id ORDER BY a.id DESC LIMIT 1),0) AS historical_candidate_count FROM event_candidates e WHERE e.lifecycle_status='active' AND e.match_status IN ('auto_new_story','auto_attach','ambiguous_ai') ORDER BY e.updated_at DESC,e.id DESC LIMIT 12"
          npx --yes wrangler@4 d1 execute DB --remote --json --command "$SQL" > d1-story-real/events.json
          SQL2="SELECT language,event_count,max_df,context_version FROM story_shortlist_contexts ORDER BY language"
          npx --yes wrangler@4 d1 execute DB --remote --json --command "$SQL2" > d1-story-real/contexts.json

      - name: Replay candidate lookup read-only per event
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          root=pathlib.Path('d1-story-real')
          raw=json.load(open(root/'events.json'))
          events=[]
          for x in raw if isinstance(raw,list) else [raw]: events += (x or {}).get('results') or []
          summaries=[]
          for i,e in enumerate(events):
              eid=str(e['id']).replace("'","''")
              sql=f"""
          WITH ev AS (
            SELECT * FROM event_candidates WHERE id='{eid}' LIMIT 1
          ), ctx AS (
            SELECT max_df,event_count FROM story_shortlist_contexts
            WHERE language=(SELECT language FROM ev) LIMIT 1
          ), event_keys AS (
            SELECT DISTINCT key_type,key_value FROM (
              SELECT 'person' AS key_type, lower(trim(CAST(j.value AS TEXT))) AS key_value FROM ev,json_each(ev.primary_people_json) j
              UNION ALL SELECT 'club',lower(trim(CAST(j.value AS TEXT))) FROM ev,json_each(ev.primary_clubs_json) j
              UNION ALL SELECT 'relation_from',lower(trim(relation_from)) FROM ev WHERE relation_from IS NOT NULL AND trim(relation_from)<>''
              UNION ALL SELECT 'relation_from',lower(trim(relation_to)) FROM ev WHERE relation_to IS NOT NULL AND trim(relation_to)<>''
              UNION ALL SELECT 'relation_to',lower(trim(relation_from)) FROM ev WHERE relation_from IS NOT NULL AND trim(relation_from)<>''
              UNION ALL SELECT 'relation_to',lower(trim(relation_to)) FROM ev WHERE relation_to IS NOT NULL AND trim(relation_to)<>''
              UNION ALL SELECT 'club',lower(trim(relation_from)) FROM ev WHERE relation_from IS NOT NULL AND trim(relation_from)<>''
              UNION ALL SELECT 'club',lower(trim(relation_to)) FROM ev WHERE relation_to IS NOT NULL AND trim(relation_to)<>''
              UNION ALL SELECT 'relation_from',lower(trim(CAST(j.value AS TEXT))) FROM ev,json_each(ev.primary_clubs_json) j
              UNION ALL SELECT 'relation_to',lower(trim(CAST(j.value AS TEXT))) FROM ev,json_each(ev.primary_clubs_json) j
              UNION ALL SELECT 'competition',lower(trim(competition)) FROM ev WHERE competition IS NOT NULL AND trim(competition)<>''
              UNION ALL SELECT 'opponent',lower(trim(CAST(j.value AS TEXT))) FROM ev,json_each(ev.opponents_json) j
              UNION ALL
              SELECT 'salient',lower(trim(CAST(j.value AS TEXT)))
              FROM ev,json_each(ev.lexical_tokens_json) j
              LEFT JOIN story_shortlist_token_df df
                ON df.language=ev.language AND df.token=lower(trim(CAST(j.value AS TEXT)))
              CROSS JOIN ctx
              WHERE length(trim(CAST(j.value AS TEXT)))>=4
                AND COALESCE(df.document_count,0) <= ctx.max_df
            ) WHERE key_value IS NOT NULL AND key_value<>''
          )
          SELECT s.id,COUNT(*) AS matched_key_count
          FROM event_keys q
          JOIN story_index_keys AS k INDEXED BY idx_story_index_keys_lookup
            ON k.key_type=q.key_type AND k.key_value=q.key_value
          JOIN stories s ON s.id=k.story_id
          WHERE s.status='active' AND s.merged_into_story_id IS NULL
          GROUP BY s.id
          ORDER BY matched_key_count DESC,COALESCE(s.last_event_at,s.created_at) DESC,s.id ASC
          LIMIT 64
          """
              out=root/f'event-{i:02d}.json'
              cp=subprocess.run(['npx','--yes','wrangler@4','d1','execute','DB','--remote','--json','--command',sql],text=True,capture_output=True)
              out.write_text(cp.stdout or '[]')
              if cp.returncode:
                  raise SystemExit(cp.stderr)
              payload=json.loads(cp.stdout)
              xs=payload if isinstance(payload,list) else [payload]
              rows=[]; reads=0
              for x in xs:
                  rows += (x or {}).get('results') or []
                  reads += int(((x or {}).get('meta') or {}).get('rows_read') or 0)
              summaries.append({
                'event_id':e['id'],'updated_at':e.get('updated_at'),'match_status':e.get('match_status'),
                'family':e.get('family'),'historical_candidate_count':int(e.get('historical_candidate_count') or 0),
                'replay_candidate_count':len(rows),'rows_read':reads
              })
          json.dump(summaries,open(root/'summary.json','w'),ensure_ascii=False,indent=2)
          PY

      - name: Report
        run: |
          python3 - <<'PY' | tee d1-story-real/report.md >> "$GITHUB_STEP_SUMMARY"
          import json
          rows=json.load(open('d1-story-real/summary.json'))
          cr=json.load(open('d1-story-real/contexts.json'))
          contexts=[]
          for x in cr if isinstance(cr,list) else [cr]: contexts += (x or {}).get('results') or []
          print('# STORY real-event candidate lookup benchmark — 2026-10-05')
          print()
          print('Read-only replay of recent real matched EVENTs using current shortlist DF/max_df filtering.')
          print()
          print('## Current shortlist contexts')
          for c in contexts: print(f"- {c.get('language')}: event_count={c.get('event_count')}, max_df={c.get('max_df')}")
          print()
          print('| event | status | family | historical candidates | replay candidates | rows_read |')
          print('|---|---|---|---:|---:|---:|')
          for r in rows:
              print(f"| `{str(r['event_id'])[:12]}…` | {r['match_status']} | {r['family']} | {r['historical_candidate_count']} | {r['replay_candidate_count']} | {r['rows_read']:,} |")
          vals=[r['rows_read'] for r in rows]
          print()
          if vals:
              print(f'- min: **{min(vals):,}**')
              print(f'- median-ish: **{sorted(vals)[len(vals)//2]:,}**')
              print(f'- max: **{max(vals):,}**')
              print(f'- sum for {len(vals)} replays: **{sum(vals):,}**')
          PY

      - name: Comment investigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 91 --repo "$GITHUB_REPOSITORY" --body-file d1-story-real/report.md

      - uses: actions/upload-artifact@v4
        with:
          name: d1-story-real-${{ github.run_id }}
          path: d1-story-real/**
          retention-days: 7
