name: Ops D1 enrichment audit

on:
  push:
    branches:
      - codex/audit-d1-row-reads-2026-09-25
    paths:
      - .github/workflows/ops-d1-enrichment-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Locate Sep 27 cutoff
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          runq() { echo; echo "===== $1 ====="; npx wrangler d1 execute DB --remote --json --command "$2"; }
          START='2026-09-27T00:00:00.000Z'
          END='2026-09-28T00:00:00.000Z'
          runq "processing_timeline" "SELECT substr(started_at,1,13) AS hour_utc, COUNT(*) AS runs, SUM(candidates) AS candidates, SUM(processed) AS processed FROM processing_runs WHERE started_at >= '$START' AND started_at < '$END' GROUP BY substr(started_at,1,13) ORDER BY hour_utc;"
          runq "collection_timeline" "SELECT substr(started_at,1,13) AS hour_utc, COUNT(*) AS runs, SUM(articles_discovered) AS discovered, SUM(articles_inserted) AS inserted, SUM(articles_updated) AS updated, SUM(error_count) AS errors FROM collection_runs WHERE started_at >= '$START' AND started_at < '$END' GROUP BY substr(started_at,1,13) ORDER BY hour_utc;"
          runq "last_processing" "SELECT started_at, finished_at, status, candidates, processed, failed, retry FROM processing_runs WHERE started_at >= '$START' AND started_at < '$END' ORDER BY started_at DESC LIMIT 12;"
          runq "last_collections" "SELECT started_at, finished_at, status, articles_discovered, articles_inserted, articles_updated, error_count FROM collection_runs WHERE started_at >= '$START' AND started_at < '$END' ORDER BY started_at DESC LIMIT 12;"
