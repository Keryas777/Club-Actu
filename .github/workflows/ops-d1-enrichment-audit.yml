name: Ops D1 enrichment audit

on:
  push:
    branches:
      - codex/audit-d1-row-reads-2026-09-25
    paths:
      - .github/workflows/ops-d1-enrichment-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Inspect Sep 27 workload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          runq() {
            echo
            echo "===== $1 ====="
            npx wrangler d1 execute DB --remote --json --command "$2"
          }
          START='2026-09-27T00:00:00.000Z'
          END='2026-09-28T00:00:00.000Z'

          runq "collection_runs_sep27" "SELECT COUNT(*) AS runs, COALESCE(SUM(sources_attempted),0) AS sources_attempted, COALESCE(SUM(articles_discovered),0) AS discovered, COALESCE(SUM(articles_inserted),0) AS inserted, COALESCE(SUM(articles_updated),0) AS updated, COALESCE(SUM(error_count),0) AS errors FROM collection_runs WHERE started_at >= '$START' AND started_at < '$END';"

          runq "processing_runs_sep27" "SELECT COUNT(*) AS runs, COALESCE(SUM(candidates),0) AS candidates, COALESCE(SUM(processed),0) AS processed, COALESCE(SUM(relevant),0) AS relevant, COALESCE(SUM(rejected),0) AS rejected, COALESCE(SUM(needs_review),0) AS needs_review, COALESCE(SUM(extracted),0) AS extracted, COALESCE(SUM(retry),0) AS retry, COALESCE(SUM(failed),0) AS failed FROM processing_runs WHERE started_at >= '$START' AND started_at < '$END';"

          runq "article_versions_sep27" "SELECT COUNT(*) AS versions FROM article_versions WHERE captured_at >= '$START' AND captured_at < '$END';"

          runq "assessments_sep27" "SELECT COUNT(*) AS assessments FROM article_club_assessments WHERE decided_at >= '$START' AND decided_at < '$END';"

          runq "event_candidates_sep27" "SELECT COUNT(*) AS events FROM event_candidates WHERE created_at >= '$START' AND created_at < '$END';"

          runq "embeddings_sep27" "SELECT COUNT(*) AS embeddings FROM event_embeddings WHERE created_at >= '$START' AND created_at < '$END';"

          runq "story_attempts_sep27" "SELECT COUNT(*) AS attempts, SUM(CASE WHEN decision='AUTO_NEW_STORY' THEN 1 ELSE 0 END) AS auto_new, SUM(CASE WHEN decision='AUTO_ATTACH' THEN 1 ELSE 0 END) AS auto_attach, SUM(CASE WHEN decision='AMBIGUOUS_AI' THEN 1 ELSE 0 END) AS ambiguous FROM story_match_attempts WHERE created_at >= '$START' AND created_at < '$END';"
