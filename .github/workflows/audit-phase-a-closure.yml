name: Audit Phase A closure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-a-closure-audit-manual
  cancel-in-progress: false

jobs:
  audit:
    name: Audit OL PSG OM Phase A
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Worker diagnostics
        env:
          BASE_URL: https://club-actu.deliriousfan7.workers.dev
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error "$BASE_URL/health" -o health.json
          curl --fail-with-body --silent --show-error "$BASE_URL/api/collection-audit?limit=20" -o collection-audit.json
          curl --fail-with-body --silent --show-error "$BASE_URL/api/phase-a-closure-status" -o closure-status.json

          for club in ol psg om; do
            curl --fail-with-body --silent --show-error \
              "$BASE_URL/api/processing-status?club=$club&limit=20" \
              -o "processing-$club.json"

            curl --fail-with-body --silent --show-error \
              "$BASE_URL/api/relevance-audit?club=$club&limit=50&compact=1" \
              -o "relevance-$club.json"

            curl --fail-with-body --silent --show-error \
              "$BASE_URL/api/phase-b-preview?club=$club&limit=60&pairs=20" \
              -o "phase-b-$club.json"
          done

      - name: Print raw diagnostics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in [
              Path('health.json'),
              Path('collection-audit.json'),
              Path('closure-status.json'),
              *[Path(f'processing-{club}.json') for club in ('ol','psg','om')],
              *[Path(f'relevance-{club}.json') for club in ('ol','psg','om')],
              *[Path(f'phase-b-{club}.json') for club in ('ol','psg','om')],
          ]:
              print(f'\n===== {path.name} =====')
              with path.open(encoding='utf-8') as f:
                  print(json.dumps(json.load(f), ensure_ascii=False, indent=2))
          PY

      - name: Write Phase A closure summary
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json

          clubs = [('ol', 'OL'), ('psg', 'PSG'), ('om', 'OM')]

          def load(path):
              with open(path, encoding='utf-8') as f:
                  return json.load(f)

          health = load('health.json')
          collection = load('collection-audit.json')
          closure = load('closure-status.json')
          latest = collection.get('latest_run') or {}
          details = latest.get('source_details') or []
          source_ok = sum(1 for row in details if isinstance(row, dict) and row.get('ok'))
          source_total = len([row for row in details if isinstance(row, dict)])
          source_errors = [row for row in details if isinstance(row, dict) and not row.get('ok')]
          closure_clubs = closure.get('clubs') or {}

          print('# Club Actu — Phase A closure audit')
          print()
          print('## Infrastructure / collection')
          print()
          print(f"- Worker health: **{'OK' if health.get('ok') else 'ERROR'}**")
          print(f"- Latest collection: **{latest.get('status', 'unknown')}**")
          print(f"- Sources OK: **{source_ok}/{source_total}**")
          print(f"- Source errors: **{len(source_errors)}**")
          print(f"- Collection started: `{latest.get('started_at')}`")
          print(f"- Collection finished: `{latest.get('finished_at')}`")
          print()

          print('## Phase A exact closure state')
          print()
          print('| Club | status | relevant | rejected | needs_review | retry | failed | waiting | role queue | role errors |')
          print('|---|---|---:|---:|---:|---:|---:|---:|---:|---:|')
          for club, label in clubs:
              row = closure_clubs.get(club) or {}
              print(
                  f"| {label} | {row.get('status', 'unknown')} | {row.get('relevant', 0)} | "
                  f"{row.get('rejected', 0)} | {row.get('needs_review', 0)} | {row.get('retry', 0)} | "
                  f"{row.get('failed', 0)} | {row.get('waiting', 0)} | {row.get('role_queue_pending', 0)} | "
                  f"{row.get('role_classifier_errors', 0)} |"
              )
          print()

          print('## needs_review breakdown')
          print()
          for club, label in clubs:
              row = closure_clubs.get(club) or {}
              print(f'### {label}')
              print('```json')
              print(json.dumps(row.get('review_reasons') or [], ensure_ascii=False, indent=2))
              print('```')
              print()

          print('## Stored text cleanliness')
          print()
          text_cleanup = closure.get('text_cleanup') or {}
          print(f"- Known noisy extractions remaining: **{text_cleanup.get('known_noise_remaining', 0)}**")
          print('```json')
          print(json.dumps(text_cleanup.get('by_source') or [], ensure_ascii=False, indent=2))
          print('```')
          print()

          print('## Current review examples')
          print()
          for club, label in clubs:
              p = load(f'processing-{club}.json')
              examples = p.get('examples') or p.get('recent') or p.get('articles') or []
              print(f'### {label}')
              print('```json')
              print(json.dumps(examples[:10] if isinstance(examples, list) else examples, ensure_ascii=False, indent=2))
              print('```')
              print()

          print('## Phase B readiness preview')
          print()
          phase_b_usable = True
          for club, label in clubs:
              b = load(f'phase-b-{club}.json')
              compact = {
                  key: b.get(key)
                  for key in ('club_id', 'article_count', 'pair_count', 'strong_count', 'candidate_count')
                  if key in b
              }
              if not compact:
                  compact = {k: v for k, v in b.items() if k != 'pairs'}
              if int(b.get('article_count') or 0) <= 0:
                  phase_b_usable = False
              print(f'### {label}')
              print('```json')
              print(json.dumps(compact, ensure_ascii=False, indent=2))
              print('```')
              print()

          collection_ok = bool(health.get('ok')) and latest.get('status') == 'success' and source_ok == 13 and source_total == 13 and not source_errors
          queues_ok = all(
              int((closure_clubs.get(club) or {}).get(key) or 0) == 0
              for club, _ in clubs
              for key in ('retry', 'failed', 'waiting', 'role_queue_pending', 'role_classifier_errors')
          )
          text_ok = int(text_cleanup.get('known_noise_remaining') or 0) == 0

          def mark(ok):
              return 'x' if ok else ' '

          print('## Closure checklist')
          print()
          print(f"- [{mark(collection_ok)}] Latest collection healthy (13/13, 0 errors)")
          print(f"- [{mark(queues_ok)}] No retry/failed/waiting backlog and no unresolved role-classifier queue")
          print('- [ ] OL relevant/rejected/review distribution plausible — manual semantic check')
          print('- [ ] PSG relevant/rejected/review distribution plausible — manual semantic check')
          print('- [ ] OM relevant/rejected/review distribution plausible — manual semantic check')
          print('- [ ] Review samples show no obvious systematic false positives — manual semantic check')
          print(f"- [{mark(text_ok)}] Known HTML entities / paywall / cookie / RSS boilerplate cleaned")
          print(f"- [{mark(phase_b_usable)}] Phase B receives a usable relevant corpus for all three clubs")
          PY
