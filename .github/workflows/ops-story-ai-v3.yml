name: Ops harden STORY AI same-subject prompt

on:
  push:
    branches:
      - codex/d1-2-story-ai-v3
    paths:
      - .github/workflows/ops-story-ai-v3.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-2-story-ai-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund

      - name: Harden same-subject contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/story-ai-resolver.js')
          s = p.read_text()
          s = s.replace("export const STORY_AI_PROMPT_VERSION = 'story-ai-ambiguity-v2';", "export const STORY_AI_PROMPT_VERSION = 'story-ai-ambiguity-v3';")

          old = """        'Attach only when the new EVENT is clearly another update or report about the same underlying subject. Choose new_story when it is a distinct subject. ' +\n        'Choose unsure whenever the supplied evidence is insufficient or genuinely balanced. Never choose a story_id that is not supplied. ' +\n        'For attach, evidence_event_ids must include the new EVENT id and at least one representative member EVENT id from the selected STORY; if no representative member is supplied, do not attach. ' +\n        'Do not invent facts. Keep the rationale short and factual, in French. Cite only supplied EVENT ids in evidence_event_ids.'"""

          new = """        'Attach only when the new EVENT is clearly another update or report about the SAME CENTRAL DOSSIER, not merely something related to it. ' +\n        'Ask: would an editor reasonably keep both EVENTs inside one evolving article/dossier without changing its central subject? If the answer is no, choose new_story. ' +\n        'Shared names are weak evidence: the same coach, player, club, competition, national team, date, or fixture can appear in several distinct STORYs. ' +\n        'Different central people, transactions, decisions, injuries, disciplinary cases, supporter incidents or controversies are distinct subjects unless the supplied evidence clearly shows they are updates of one dossier. ' +\n        'Concrete negative example: “Zidane may call Tolisso to France” and “Zidane plans a role for Cherki” are DIFFERENT STORYs despite sharing Zidane and an OL context. ' +\n        'Concrete match rule: line-ups, the result, match analysis and direct post-match reactions about that same fixture may belong to one match STORY. But a separate supporter-banner, crowd, security or disciplinary incident that merely occurs during that fixture is NOT automatically the match STORY; choose new_story when the incident itself is the central subject. ' +\n        'Choose new_story when it is a distinct subject. Choose unsure whenever the supplied evidence is insufficient or genuinely balanced. Never choose a story_id that is not supplied. ' +\n        'For attach, evidence_event_ids must include the new EVENT id and at least one representative member EVENT id from the selected STORY; if no representative member is supplied, do not attach. ' +\n        'The rationale must state the concrete identity link that makes the CENTRAL SUBJECT the same; wording such as merely “related to”, “linked to”, “same club/player” or “same match” is not sufficient justification. ' +\n        'Do not invent facts. Keep the rationale short and factual, in French. Cite only supplied EVENT ids in evidence_event_ids.'"""
          if old not in s:
              raise SystemExit('prompt anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('test/story-ai-resolver.test.js')
          ts = t.read_text()
          ts = ts.replace("assert.match(messages[0].content, /Never choose a story_id that is not supplied/i);", """assert.match(messages[0].content, /Never choose a story_id that is not supplied/i);\n  assert.match(messages[0].content, /SAME CENTRAL DOSSIER/);\n  assert.match(messages[0].content, /Zidane may call Tolisso.*Zidane plans a role for Cherki/);\n  assert.match(messages[0].content, /supporter-banner.*NOT automatically the match STORY/);\n  assert.match(messages[0].content, /line-ups, the result, match analysis and direct post-match reactions/);""")
          t.write_text(ts)
          PY

      - name: Validate
        run: |
          set -euo pipefail
          node --check src/story-ai-resolver.js
          npm test

      - name: Commit and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ops-story-ai-v3.yml
          git add src/story-ai-resolver.js test/story-ai-resolver.test.js
          git commit -m 'D1.2: harden AI same-subject arbitration'
          git push origin HEAD:codex/d1-2-story-ai-v3
